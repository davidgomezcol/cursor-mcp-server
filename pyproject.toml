[project]
name = "cursor-mcp-server"
version = "0.1.0"
description = "MCP server providing Jira issue context to AI assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "jira>=3.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
jira-mcp-server = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
